name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/USBreeze.App/USBreeze.App.csproj -c Release
      - name: Check localization and file safety
        run: dotnet run --project tests/USBreeze.Checks -c Release
      - name: Publish portable Windows x64 app
        run: dotnet publish src/USBreeze.App/USBreeze.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/USBreeze-win-x64
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/USBreeze-win-x64/* -DestinationPath artifacts/USBreeze-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: USBreeze-win-x64
          path: artifacts/USBreeze-win-x64.zip
          if-no-files-found: error
