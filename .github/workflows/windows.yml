name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/USBreeze.App/USBreeze.App.csproj -c Release
      - name: Check localization and file safety
        run: dotnet run --project tests/USBreeze.Checks -c Release
      - name: Check smooth number updates
        run: dotnet run --project tests/USBreeze.UIChecks -c Release
      - name: Publish standalone Windows x64 EXE
        run: dotnet publish src/USBreeze.App/USBreeze.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/single-file
      - name: Verify single-file package
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/single-file -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'USBreeze.exe') {
            throw 'Expected exactly one standalone USBreeze.exe'
          }
          [xml]$project = Get-Content src/USBreeze.App/USBreeze.App.csproj
          $version = $project.Project.PropertyGroup.Version
          Move-Item artifacts/single-file/USBreeze.exe "artifacts/USBreeze-v$version-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: USBreeze-win-x64-exe
          path: artifacts/USBreeze-v*-win-x64.exe
          if-no-files-found: error
